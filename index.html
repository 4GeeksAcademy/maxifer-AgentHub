<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="h-full bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div class="min-h-screen lg:grid lg:grid-cols-[18rem_1fr]">
      <aside class="flex flex-col border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 lg:sticky lg:top-0 lg:h-screen lg:border-b-0 lg:border-r">
        <div class="flex items-center justify-between border-b border-slate-200 px-6 py-5 dark:border-slate-800">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.24em] text-cyan-600 dark:text-cyan-400">AgentHub</p>
            <h1 class="text-lg font-bold">Admin Panel</h1>
          </div>
          <button id="mobileNavToggle" class="rounded-md border border-slate-300 p-2 text-slate-700 dark:border-slate-700 dark:text-slate-300 lg:hidden" aria-label="Toggle menu">
            <i data-lucide="menu" class="h-4 w-4"></i>
          </button>
        </div>
        <nav id="sidebarNav" class="hidden px-4 py-4 lg:flex lg:h-full lg:flex-col" aria-label="Main navigation"></nav>
      </aside>

      <div class="flex min-h-screen flex-col">
        <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-900/95">
          <div class="flex items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
            <div>
              <h2 id="sectionTitle" class="text-xl font-semibold">Dashboard</h2>
              <p id="sectionSubtitle" class="text-sm text-slate-500 dark:text-slate-400">Overview operativo</p>
            </div>
            <div class="flex items-center gap-3">
              <button id="themeToggle" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800" aria-label="Toggle dark mode">
                <i data-lucide="moon" class="h-4 w-4"></i>
                <span id="themeToggleText">Dark</span>
              </button>

              <div class="relative" data-dropdown="account-menu">
                <button
                  class="inline-flex items-center gap-3 rounded-xl border border-slate-300 bg-white px-2 py-1.5 text-left text-sm shadow-sm transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800"
                  data-dropdown-trigger="account-menu"
                  aria-expanded="false"
                  aria-label="Abrir menu de cuenta"
                >
                  <img
                    src="https://i.pravatar.cc/80?img=68"
                    alt="Admin User"
                    class="h-8 w-8 rounded-full border border-slate-200 object-cover dark:border-slate-700"
                  />
                  <span class="hidden leading-tight sm:block">
                    <span class="block font-semibold">Admin User</span>
                    <span class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">System Architect</span>
                  </span>
                  <i data-lucide="chevron-down" class="h-4 w-4 text-slate-500 dark:text-slate-400"></i>
                </button>

                <div class="pointer-events-none absolute right-0 z-20 mt-2 hidden min-w-56 rounded-xl border border-slate-200 bg-white py-2 shadow-2xl dark:border-slate-700 dark:bg-slate-900" data-dropdown-menu="account-menu">
                  <button class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-slate-700 transition hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800" data-action="profile-view">
                    <i data-lucide="user-round" class="h-4 w-4"></i>
                    Perfil
                  </button>
                </div>
              </div>
            </div>
          </div>
        </header>

        <main id="appContent" class="flex-1 px-4 py-6 sm:px-6 lg:px-8"></main>
      </div>
    </div>

    <div id="modalRoot"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
